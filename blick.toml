[agent]
kind = "opencode"
model = "fireworks-ai/accounts/fireworks/models/kimi-k2p5"

[defaults]
base = "origin/main"
max_concurrency = 2
fail_on = "high"

[[skills]]
name = "rust-best-practices"
source = "apollographql/skills"
subpath = "skills/rust-best-practices"

[[skills]]
name = "schlussel-rust-review"
source = "./.blick/skills/schlussel-rust-review"

[[reviews]]
name = "default"
skills = ["rust-best-practices", "schlussel-rust-review"]
prompt = """
Focus on correctness, OAuth flow behavior, token persistence, lock safety,
formula parsing, and CLI contract regressions.

Skip style nits since rustfmt and CI already cover the basics.
"""

[learn]
lookback_days = 7
min_signal = 3
base = "main"
draft = true
branch = "blick/learn"
