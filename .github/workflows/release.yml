name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release"
        type: string

permissions:
  contents: write
  pull-requests: read

env:
  MISE_AUTO_INSTALL: "false"
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  MISE_NOT_FOUND_AUTO_INSTALL: "false"
  MISE_EXEC_AUTO_INSTALL: "false"

jobs:
  check-release:
    name: Check for releasable changes
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, '[Release]')"
    outputs:
      should-release: ${{ steps.is-releasable.outputs.should-release }}
      next-version: ${{ steps.next-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          install_args: "git-cliff"

      - name: Check if there are releasable changes
        id: is-releasable
        run: |
          if ! git describe --tags --abbrev=0 2>/dev/null; then
            echo "No tags found, this will be the first release"
            echo "should-release=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          bumped_output=$(git cliff --bump --unreleased 2>/dev/null || echo "")
          if [ -z "$bumped_output" ]; then
            echo "No releasable changes found"
            echo "should-release=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ ! -f CHANGELOG.md ]; then
            echo "should-release=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          changelog_content=$(cat CHANGELOG.md)
          bumped_hash=$(echo -n "$bumped_output" | shasum -a 256 | awk '{print $1}')
          changelog_hash=$(echo -n "$changelog_content" | shasum -a 256 | awk '{print $1}')

          if [ "$bumped_hash" != "$changelog_hash" ]; then
            echo "should-release=true" >> $GITHUB_OUTPUT
          else
            echo "should-release=false" >> $GITHUB_OUTPUT
          fi

      - name: Get next version
        id: next-version
        if: steps.is-releasable.outputs.should-release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "version=$(git cliff --bumped-version)" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # Build CLI binaries
  # ===========================================================================
  build-cli:
    name: Build CLI (${{ matrix.artifact }})
    needs: check-release
    if: needs.check-release.outputs.should-release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: schlussel-x86_64-linux
            ext: ""
          - os: macos-latest
            artifact: schlussel-native-macos
            ext: ""
          - os: windows-latest
            artifact: schlussel-x86_64-windows
            ext: .exe
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          install_args: "rust"

      - name: Set workspace version
        run: python scripts/set_workspace_version.py "${{ needs.check-release.outputs.next-version }}"

      - name: Build release binary
        run: cargo build --release --bin schlussel

      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist
          cd dist
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp ../target/release/schlussel.exe schlussel.exe
            powershell.exe -NoLogo -NoProfile -Command "Compress-Archive -Path schlussel.exe -DestinationPath '${{ matrix.artifact }}.zip' -Force"
          else
            cp ../target/release/schlussel schlussel
            tar -czvf ${{ matrix.artifact }}.tar.gz schlussel
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.tar.gz
            dist/${{ matrix.artifact }}.zip
          if-no-files-found: ignore

  # ===========================================================================
  # Build Swift XCFramework
  # ===========================================================================
  build-swift-xcframework:
    name: Build Swift XCFramework
    needs: check-release
    if: needs.check-release.outputs.should-release == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          install_args: "rust 1password-cli"

      - name: Set workspace version
        run: python scripts/set_workspace_version.py "${{ needs.check-release.outputs.next-version }}"

      - name: Build Swift XCFramework
        run: bash scripts/build_apple_xcframework.sh
        env:
          SCHLUSSEL_FRAMEWORK_VERSION: ${{ needs.check-release.outputs.next-version }}
          APPLE_TEAM_ID: U6LC622NKF
          APPLE_CERTIFICATE_NAME: 'Developer ID Application: Tuist GmbH (U6LC622NKF)'
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Upload Swift artifact
        uses: actions/upload-artifact@v4
        with:
          name: schlussel-swift-xcframework
          path: build/Schlussel.xcframework.zip
          if-no-files-found: error

  # ===========================================================================
  # Publish release
  # ===========================================================================
  publish:
    name: Publish release
    needs:
      - check-release
      - build-cli
      - build-swift-xcframework
    if: needs.check-release.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          install_args: "git-cliff"

      - name: Set workspace version
        run: python scripts/set_workspace_version.py "${{ needs.check-release.outputs.next-version }}"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release/ \;
          cd release
          sha256sum * > sha256.txt 2>/dev/null || true
          sha512sum * > sha512.txt 2>/dev/null || true

      - name: Update CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: git cliff --bump -o CHANGELOG.md --github-repo "$GITHUB_REPO"

      - name: Commit changes
        id: auto-commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md Cargo.toml Cargo.lock
          git commit --allow-empty -m "[Release] Schlussel ${{ needs.check-release.outputs.next-version }}"
          git push
          echo "commit_hash=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Get release notes
        id: release-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          echo "RELEASE_NOTES<<EOF" >> "$GITHUB_OUTPUT"
          git cliff --latest --github-repo "$GITHUB_REPO" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          name: ${{ needs.check-release.outputs.next-version }}
          tag_name: ${{ needs.check-release.outputs.next-version }}
          body: ${{ steps.release-notes.outputs.RELEASE_NOTES }}
          target_commitish: ${{ steps.auto-commit.outputs.commit_hash }}
          files: |
            release/*
