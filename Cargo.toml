[workspace]
resolver = "2"
members = [
    "crates/schlussel",
    "crates/schlussel-cli",
    "crates/schlussel-oauth-test-server",
]

[workspace.package]
version = "0.13.2"
edition = "2021"
rust-version = "1.86"
license = "MIT"
repository = "https://github.com/pepicrft/schlussel"

[workspace.dependencies]
schlussel = { path = "crates/schlussel" }

anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
directories = "5"
fs4 = "0.8"
include_dir = "0.7"
keyring = "3"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
tempfile = "3"
thiserror = "1"
tiny_http = "0.12"
url = "2"
webbrowser = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
